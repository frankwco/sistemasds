name: gestaofacil
description: Gestão Fácil (DS Resíduos) - fluxo de coleta em Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  http: ^1.2.1
  connectivity_plus: ^6.0.3
  url_launcher: ^6.3.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  workmanager: ^0.10.10
  firebase_storage: ^12.4.10
  image_picker: ^1.2.4
  record: ^7.1.2
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true

# Ícone do app (gerado por tool/gerar_icone_test.dart). Propositalmente diferente do app Ionic
# (quadrado verde com "DS") para os usuários não confundirem os dois durante a transição.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icone/icone.png"
  adaptive_icon_background: "#14409F"
  adaptive_icon_foreground: "assets/icone/icone_frente.png"
