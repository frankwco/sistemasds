<ion-header>
    <ion-toolbar color="success">
      <ion-buttons slot="start">
  <ion-back-button></ion-back-button>
</ion-buttons>
        <ion-title>Fechamento Mês</ion-title>
    </ion-toolbar>
</ion-header>
<ion-content>

  <ion-list>
    <ion-item>
      <ion-label>Mês</ion-label>
      <ion-select placeholder="Selecione">
        <ion-select-option selected value="f">Janeiro</ion-select-option>
        <ion-select-option value="m">Fevereiro</ion-select-option>
          <ion-select-option value="mc">...</ion-select-option>
      </ion-select>
    </ion-item>

    <ion-item>
      <ion-label>Ano</ion-label>
      <ion-select placeholder="Selecione">
        <ion-select-option value="f">2020</ion-select-option>
        <ion-select-option value="m">2021</ion-select-option>
        <ion-select-option value="mv">...</ion-select-option>
      </ion-select>
    </ion-item>

  </ion-list>

    <ion-searchbar type="text" debounce="200" (ionChange)="getItems($event)"></ion-searchbar>

    <ion-list *ngIf="isItemAvailable">
        <ion-item *ngFor="let item of items">{{ item }}</ion-item>
    </ion-list>

</ion-content>
