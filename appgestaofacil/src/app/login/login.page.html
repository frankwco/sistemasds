<ion-content class="login-content" [scrollY]="false">

  <!-- Área superior com gradiente -->
  <div class="login-header">
    <div class="logo-wrapper">
      <ion-icon name="shield-checkmark-outline" class="logo-icon"></ion-icon>
    </div>
    <h1 class="app-title">Gestão Fácil</h1>
    <p class="app-subtitle">Gerencie suas operações com praticidade</p>
  </div>

  <!-- Card do formulário -->
  <div class="login-card">

    <div class="aviso">
      <ion-icon name="information-circle-outline"></ion-icon>
      <span>Disponível somente para usuários previamente cadastrados.</span>
    </div>

    <ion-item lines="none" class="input-item">
      <ion-icon name="mail-outline" slot="start" color="primary"></ion-icon>
      <ion-label position="floating">E-mail</ion-label>
      <ion-input [(ngModel)]="email" type="email" required></ion-input>
    </ion-item>

    <ion-item lines="none" class="input-item">
      <ion-icon name="lock-closed-outline" slot="start" color="primary"></ion-icon>
      <ion-label position="floating">Senha</ion-label>
      <ion-input type="password" [(ngModel)]="senha" required></ion-input>
    </ion-item>

    <ion-item lines="none" class="toggle-item">
      <ion-label>Manter-me conectado</ion-label>
      <ion-toggle color="success" [(ngModel)]="manterConectado" slot="end"></ion-toggle>
    </ion-item>

    <ion-button expand="block" shape="round" class="login-btn" (click)="login()">
      <ion-icon name="log-in-outline" slot="start"></ion-icon>
      Entrar
    </ion-button>

    <div class="forgot-password">
      <a (click)="recuperarSenha()">Esqueceu a senha?</a>
    </div>

  </div>

</ion-content>
