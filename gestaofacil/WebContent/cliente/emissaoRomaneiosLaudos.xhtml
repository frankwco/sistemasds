<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://java.sun.com/jsf/core">

<h:body>
	<ui:composition template="../resources/template/template-cliente.xhtml">
		<ui:define name="mensagem">
			<ui:include src="../componentes/mensagem.xhtml" />
		</ui:define>
		<ui:define name="modal-confirmacao">
			<ui:include src="../componentes/dialog-confirmacao.xhtml" />
		</ui:define>

		<ui:define name="conteudo">

		<div class="gf-page">

			<!-- ═══ HERO BANNER ═══ -->
			<div class="gf-hero hero-compact">
				<div>
					<h2><i class="fa fa-file-text" style="margin-right:10px;"></i>Romaneios e Certificados</h2>
					<p>Emita romaneios mensais e certificados de destinação dos seus resíduos</p>
				</div>
				<i class="fa fa-file-text-o hero-icon"></i>
			</div>

			<!-- ═══ LOADING STATUS ═══ -->
			<p:ajaxStatus onstart="PF('statusDialog').show()" onsuccess="PF('statusDialog').hide()" />
			<p:dialog widgetVar="statusDialog" modal="true" draggable="false"
				closable="false" resizable="false" showHeader="false"
				styleClass="gf-loading-dialog">
				<span class="gf-loading-text">Aguarde, carregando...</span>
				<p:graphicImage name="img/aguarde.gif" />
			</p:dialog>

			<!-- ═══ TABELA DE ROMANEIOS ═══ -->
			<h:form id="frmTabela">
				<!-- Auto-load: dispara uma vez no carregamento inicial da página -->
				<p:remoteCommand name="carregarRomaneios"
					action="#{fechamentoMesMB.buscarFechamentoMesCliente}"
					update="tabela"
					onstart="PF('statusDialog').show()"
					oncomplete="PF('statusDialog').hide()" />
				<script type="text/javascript">$(document).ready(function(){ carregarRomaneios(); });</script>
				<div class="gf-card">
					<div class="gf-card-header">
						<i class="fa fa-list icon-blue"></i>
						<div>
							<h4>Fechamentos do Mês</h4>
							<small>Selecione o período para emitir romaneio ou certificado</small>
						</div>
					</div>

					<p:dataTable id="tabela"
						value="#{fechamentoMesMB.listaFechamentoMes}"
						resizableColumns="true" reflow="true" var="list" rows="10"
						paginator="true" paginatorPosition="bottom"
						emptyMessage="Nenhum registro encontrado."
						rowsPerPageTemplate="10,15,30,50,100">

						<p:column style="white-space:normal !important;"
							headerText="Dados do Cliente"
							filterBy="#{list.informacaoFinanceira.cliente.nomeRazaoSocialNomeFantasiaEndereco}"
							sortBy="#{list.informacaoFinanceira.cliente.nomeRazaoSocialNomeFantasiaEndereco}"
							filterMatchMode="contains">
							<h:outputText
								value="#{list.informacaoFinanceira.cliente.nomeRazaoSocialNomeFantasiaEndereco}" />
						</p:column>

						<p:column headerText="Mês/Ano"
							filterBy="#{list.mesComZeroAno}"
							sortBy="#{list.mesComZeroAno}"
							filterMatchMode="contains">
							<h:outputText value="#{list.mesComZeroAno}" />
						</p:column>

						<p:column headerText="Ações / Emitir">
							<div class="action-btn-group">
								<span class="btn-primary-modern">
									<p:commandButton value="Romaneio Mensal"
										icon="fa fa-file"
										onclick="this.form.target='_blank'"
										action="#{fechamentoMesMB.gerarRomaneio(list)}" ajax="false" />
								</span>
								<span class="btn-green-modern">
									<p:commandButton value="Certificado Mensal"
										icon="fa fa-certificate"
										onclick="this.form.target='_blank'"
										action="#{fechamentoMesMB.gerarCertificado(list)}" ajax="false" />
								</span>
						<span class="btn-teal-modern">
									<p:commandButton value="Certificado por Período"
										icon="fa fa-calendar"
										actionListener="#{fechamentoMesMB.buscarPontosColetaCliente(list.informacaoFinanceira.cliente.id)}"
										oncomplete="PF('dlgSelecionarPeriodos').show()"
										update=":formSelecionarPeriodos" />
								</span>
							</div>
						</p:column>
					</p:dataTable>
				</div>
			</h:form>

			<!-- ═══ DIALOG: SELECIONAR PERÍODOS ═══ -->
			<p:dialog header="Selecionar Períodos"
				widgetVar="dlgSelecionarPeriodos" modal="true" responsive="true"
				width="90%" id="dlgSelecionarPeriodos" closable="true"
				closeOnEscape="true" resizable="false" draggable="false">
				<h:form id="formSelecionarPeriodos">

					<div class="gf-card" style="margin-bottom:12px;">
						<div class="gf-card-header" style="border-bottom:none; padding-bottom:0;">
							<i class="fa fa-calendar icon-blue"></i>
							<div><h4>Período Inicial</h4></div>
						</div>
						<div class="gf-form-group" style="flex-wrap:wrap; gap:12px;">
							<div class="gf-form-item" style="flex:0 1 180px;">
								<label>Mês Inicial:</label>
								<p:selectOneMenu style="width:100%"
									value="#{fechamentoMesMB.certificadoPeriodo.mesInicial}">
									<f:selectItem itemLabel="Janeiro" itemValue="1" />
									<f:selectItem itemLabel="Fevereiro" itemValue="2" />
									<f:selectItem itemLabel="Março" itemValue="3" />
									<f:selectItem itemLabel="Abril" itemValue="4" />
									<f:selectItem itemLabel="Maio" itemValue="5" />
									<f:selectItem itemLabel="Junho" itemValue="6" />
									<f:selectItem itemLabel="Julho" itemValue="7" />
									<f:selectItem itemLabel="Agosto" itemValue="8" />
									<f:selectItem itemLabel="Setembro" itemValue="9" />
									<f:selectItem itemLabel="Outubro" itemValue="10" />
									<f:selectItem itemLabel="Novembro" itemValue="11" />
									<f:selectItem itemLabel="Dezembro" itemValue="12" />
								</p:selectOneMenu>
							</div>
							<div class="gf-form-item" style="flex:0 1 140px;">
								<label>Ano Inicial:</label>
								<p:selectOneMenu style="width:100%"
									value="#{fechamentoMesMB.certificadoPeriodo.anoInicial}">
									<f:selectItem itemLabel="2015" itemValue="2015" />
									<f:selectItem itemLabel="2016" itemValue="2016" />
									<f:selectItem itemLabel="2017" itemValue="2017" />
									<f:selectItem itemLabel="2018" itemValue="2018" />
									<f:selectItem itemLabel="2019" itemValue="2019" />
									<f:selectItem itemLabel="2020" itemValue="2020" />
									<f:selectItem itemLabel="2021" itemValue="2021" />
									<f:selectItem itemLabel="2022" itemValue="2022" />
									<f:selectItem itemLabel="2023" itemValue="2023" />
									<f:selectItem itemLabel="2024" itemValue="2024" />
									<f:selectItem itemLabel="2025" itemValue="2025" />
									<f:selectItem itemLabel="2026" itemValue="2026" />
								</p:selectOneMenu>
							</div>
						</div>
					</div>

					<div class="gf-card" style="margin-bottom:12px;">
						<div class="gf-card-header" style="border-bottom:none; padding-bottom:0;">
							<i class="fa fa-calendar-check-o icon-green"></i>
							<div><h4>Período Final</h4></div>
						</div>
						<div class="gf-form-group" style="flex-wrap:wrap; gap:12px;">
							<div class="gf-form-item" style="flex:0 1 180px;">
								<label>Mês Final:</label>
								<p:selectOneMenu style="width:100%"
									value="#{fechamentoMesMB.certificadoPeriodo.mesFinal}">
									<f:selectItem itemLabel="Janeiro" itemValue="1" />
									<f:selectItem itemLabel="Fevereiro" itemValue="2" />
									<f:selectItem itemLabel="Março" itemValue="3" />
									<f:selectItem itemLabel="Abril" itemValue="4" />
									<f:selectItem itemLabel="Maio" itemValue="5" />
									<f:selectItem itemLabel="Junho" itemValue="6" />
									<f:selectItem itemLabel="Julho" itemValue="7" />
									<f:selectItem itemLabel="Agosto" itemValue="8" />
									<f:selectItem itemLabel="Setembro" itemValue="9" />
									<f:selectItem itemLabel="Outubro" itemValue="10" />
									<f:selectItem itemLabel="Novembro" itemValue="11" />
									<f:selectItem itemLabel="Dezembro" itemValue="12" />
								</p:selectOneMenu>
							</div>
							<div class="gf-form-item" style="flex:0 1 140px;">
								<label>Ano Final:</label>
								<p:selectOneMenu style="width:100%"
									value="#{fechamentoMesMB.certificadoPeriodo.anoFinal}">
									<f:selectItem itemLabel="2015" itemValue="2015" />
									<f:selectItem itemLabel="2016" itemValue="2016" />
									<f:selectItem itemLabel="2017" itemValue="2017" />
									<f:selectItem itemLabel="2018" itemValue="2018" />
									<f:selectItem itemLabel="2019" itemValue="2019" />
									<f:selectItem itemLabel="2020" itemValue="2020" />
									<f:selectItem itemLabel="2021" itemValue="2021" />
									<f:selectItem itemLabel="2022" itemValue="2022" />
									<f:selectItem itemLabel="2023" itemValue="2023" />
									<f:selectItem itemLabel="2024" itemValue="2024" />
									<f:selectItem itemLabel="2025" itemValue="2025" />
									<f:selectItem itemLabel="2026" itemValue="2026" />
								</p:selectOneMenu>
							</div>
						</div>
					</div>

					<p:dataTable id="tabela"
						value="#{fechamentoMesMB.listaPontosColeta}"
						resizableColumns="true" reflow="true" var="list" rows="10"
						paginator="true" paginatorPosition="bottom"
						emptyMessage="Nenhum ponto de coleta encontrado."
						rowsPerPageTemplate="10,15,30,50,100">
						<p:ajax event="filter" global="false" />

						<p:column headerText="Cliente"
							style="white-space:normal !important;"
							filterBy="#{list.cliente.nomeRazaoSocialNomeFantasia}"
							sortBy="#{list.cliente.nomeRazaoSocialNomeFantasia}"
							filterMatchMode="contains">
							<h:outputText value="#{list.cliente.nomeRazaoSocialNomeFantasia}" />
						</p:column>

						<p:column headerText="Nome/Razão"
							style="white-space:normal !important;"
							filterBy="#{list.nomeRazaoSocialNomeFantasia}"
							sortBy="#{list.nomeRazaoSocialNomeFantasia}"
							filterMatchMode="contains">
							<h:outputText value="#{list.nomeRazaoSocialNomeFantasiaEndereco}" />
						</p:column>

						<p:column headerText="Ação" width="180">
							<span class="btn-green-modern">
								<p:commandButton value="Certificado Período"
									icon="fa fa-certificate"
									onclick="this.form.target='_blank'"
									action="#{fechamentoMesMB.gerarCertificadoPeriodo(list)}"
									ajax="false" />
							</span>
						</p:column>
					</p:dataTable>

				</h:form>
			</p:dialog>

			<p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
				<p:commandButton value="Sim" type="button"
					styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
				<p:commandButton value="Não" type="button"
					styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
			</p:confirmDialog>

		</div>
		

		</ui:define>

	</ui:composition>
</h:body>
</html>
