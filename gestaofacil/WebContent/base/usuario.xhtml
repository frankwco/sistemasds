<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://java.sun.com/jsf/core">


<h:body>
	<ui:composition
		template="../resources/template/template-administrador.xhtml">
		<ui:define name="mensagem">
			<ui:include src="../componentes/mensagem.xhtml" />
		</ui:define>
		<ui:define name="modal-confirmacao">
			<ui:include src="../componentes/dialog-confirmacao.xhtml" />
		</ui:define>

		<ui:define name="conteudo">

		<div class="gf-page">

			<!-- ═══ HERO BANNER ═══ -->
			<div class="gf-hero hero-compact">
				<div>
					<h2><i class="fa fa-user" style="margin-right:10px;"></i>Usuários/Colaboradores</h2>
					<p>Cadastre usuários, colaboradores e motoristas</p>
				</div>
			</div>

			<!-- ═══ CARD: Novo registro ═══ -->
			<div class="gf-card">
				<h:form id="frmCadastrar">
					<span class="gf-new-btn">
						<p:commandButton value="  Cadastrar" icon="fa fa-plus"
							update=":frmModalSalvar"
							actionListener="#{usuarioMB.criarNovoObjeto()}"
							onclick="PF('dlgUsuario').show(); PF('dlgUsuario').content.scrollTop('0')"
							title="Cadastrar" />
					</span>
				</h:form>
			</div>

			<!-- ═══ CARD: Tabela ═══ -->
			<div class="gf-card">
				<h:form id="frmTabela">
					<p:dataTable id="tabela" value="#{usuarioMB.listaUsuario}"
						resizableColumns="true" reflow="true" var="list" rows="10"
						paginator="true" paginatorPosition="bottom"
						emptyMessage="Nenhum usuário cadastrado"
						rowsPerPageTemplate="5,10,15,30,50,100">

						<p:column headerText="Nome" filterBy="#{list.nome}"
							sortBy="#{list.nome}" filterMatchMode="contains">
							<h:outputText value="#{list.nome}" />
						</p:column>

						<p:column headerText="E-mail" filterBy="#{list.email}"
							sortBy="#{list.email}" filterMatchMode="contains">
							<h:outputText value="#{list.email}" />
						</p:column>

						<p:column headerText="Permissão" filterBy="#{list.permissao}"
							sortBy="#{list.permissao}" filterMatchMode="contains">
							<h:outputText value="#{list.permissao}" />
						</p:column>

						<p:column headerText="Ações" width="220">
							<div class="action-btn-group">
								<span class="btn-teal-modern">
									<p:commandButton icon="fa fa-key" value=" Permissões"
										update=":formTabelaPermissoes" title="Conceder Permissões"
										oncomplete="PF('dlgPermissoes').show();"
										actionListener="#{usuarioMB.preencherPermissoes(list)}" />
								</span>
								<span class="btn-primary-modern">
									<p:commandButton icon="fa fa-pencil" value=" Alterar"
										update=":frmModalSalvar" title="Alterar"
										oncomplete="PF('dlgUsuario').show();"
										actionListener="#{usuarioMB.preencherLista(list)}" />
								</span>
								<span class="btn-danger-modern">
									<p:commandButton icon="fa fa-trash-o" value=" Excluir"
										actionListener="#{usuarioMB.inativar(list)}" title="Excluir"
										update=":frmTabela :dlgInformacao" alt="Excluir">
										<p:confirm header="Confirmação" message="Deseja excluir?" />
									</p:commandButton>
								</span>
							</div>
						</p:column>

					</p:dataTable>
				</h:form>
			</div>

			<!-- ═══ DIALOG: Cadastrar/Editar ═══ -->
			<p:dialog header="Usuário/Colaborador" widgetVar="dlgUsuario"
				modal="true" responsive="true" width="60%" id="dlgUsuario"
				closable="true" closeOnEscape="true" resizable="false"
				draggable="false">
				<h:form id="frmModalSalvar">
					<div class="gf-form-group" style="flex-direction:column;">
						<div class="gf-form-item">
							<label><i class="fa fa-user" style="margin-right:6px;color:#1565C0;"></i>Nome *</label>
							<p:inputText style="width:100%" required="true" requiredMessage="Nome Obrigatório"
								onkeyup="value=value.toUpperCase()" title="Nome"
								value="#{usuarioMB.usuario.nome}" />
						</div>

						<div class="gf-form-item">
							<label><i class="fa fa-envelope-o" style="margin-right:6px;color:#1565C0;"></i>E-mail *</label>
							<p:inputText style="width:100%" title="E-mail" required="true"
								requiredMessage="E-mail obrigatório"
								value="#{usuarioMB.usuario.email}" />
						</div>

						<div class="gf-form-item">
							<label><i class="fa fa-desktop" style="margin-right:6px;color:#1565C0;"></i>Acesso ao Sistema Web?</label>
							<p:selectBooleanButton value="#{usuarioMB.usuario.acessoSistema}"
								onLabel="Sim" offLabel="Não" style="width:60px" />
						</div>

						<div class="gf-form-item">
							<label><i class="fa fa-mobile" style="margin-right:6px;color:#1565C0;"></i>Acesso ao APP?</label>
							<p:selectBooleanButton value="#{usuarioMB.usuario.acessoApp}"
								onLabel="Sim" offLabel="Não" style="width:60px" />
						</div>

						<div class="gf-form-item">
							<label><i class="fa fa-unlock-alt" style="margin-right:6px;color:#1565C0;"></i>Acesso Total?</label>
							<p:selectBooleanButton value="#{usuarioMB.usuario.acessoTotal}"
								onLabel="Sim" offLabel="Não" style="width:60px" />
						</div>

						<div class="gf-form-item">
							<label><i class="fa fa-id-badge" style="margin-right:6px;color:#1565C0;"></i>Motorista?</label>
							<p:selectBooleanButton value="#{usuarioMB.usuario.motorista}"
								onLabel="Sim" offLabel="Não" style="width:60px">
								<p:ajax update=":frmModalSalvar:pnlMotorista" />
							</p:selectBooleanButton>
						</div>

						<p:outputPanel id="pnlMotorista">
							<h:panelGroup rendered="#{usuarioMB.usuario.motorista}">
								<div class="gf-form-item">
									<label><i class="fa fa-id-card-o" style="margin-right:6px;color:#1565C0;"></i>CNH</label>
									<p:inputText style="width:100%" title="CNH" value="#{usuarioMB.usuario.cnh}" />
								</div>

								<div class="gf-form-item">
									<label><i class="fa fa-list" style="margin-right:6px;color:#1565C0;"></i>Categoria CNH</label>
									<p:inputText style="width:100%" title="Categoria CNH"
										value="#{usuarioMB.usuario.categoriaCnh}" />
								</div>

								<div class="gf-form-item">
									<label><i class="fa fa-calendar" style="margin-right:6px;color:#1565C0;"></i>Validade CNH</label>
									<p:calendar style="width:100%" value="#{usuarioMB.usuario.validadeCnh}"
										pattern="dd/MM/yyyy" />
								</div>
							</h:panelGroup>
						</p:outputPanel>
					</div>
					<small>Campos obrigatórios *</small>

					<div class="gf-modal-footer">
						<span class="btn-primary-modern">
							<p:commandButton value="  Salvar" icon="fa fa-save"
								actionListener="#{usuarioMB.salvar()}"
								update=":dlgInformacao :frmTabela" />
						</span>
						<span class="btn-secondary-modern">
							<p:commandButton value="  Cancelar" icon="fa fa-times"
								onclick="PF('dlgUsuario').hide();" alt="Cancelar" />
						</span>
					</div>
				</h:form>
			</p:dialog>

			<!-- ═══ DIALOG: Permissões ═══ -->
			<p:dialog header="Conceder Permissões" widgetVar="dlgPermissoes"
				modal="true" responsive="true" width="60%" id="dlgPermissoes"
				closable="true" closeOnEscape="true" resizable="false"
				draggable="false">
				<h:form id="frmModalConcederPermisoes">
					<div class="gf-form-group" style="flex-direction:column;">
						<div class="gf-form-item">
							<label><i class="fa fa-key" style="margin-right:6px;color:#1565C0;"></i>Permissão *</label>
							<p:autoComplete style="width:100%" dropdown="true"
								required="true" requiredMessage="Selecione a Permissão"
								value="#{usuarioMB.permissao.tipo}" scrollHeight="170"
								completeMethod="#{tipoServidorMB.completarTipoServidor}"
								forceSelection="true" converter="#{converterTipo}" var="cur"
								itemLabel="#{cur.descricao}" itemValue="#{cur}">
							</p:autoComplete>
						</div>
					</div>
					<small>Campos obrigatórios *</small>

					<div class="gf-modal-footer">
						<span class="btn-primary-modern">
							<p:commandButton value="  Incluir Permissão" icon="fa fa-plus"
								actionListener="#{usuarioMB.incluirPermissao()}"
								update=":formTabelaPermissoes" />
						</span>
						<span class="btn-secondary-modern">
							<p:commandButton value="  Fechar" icon="fa fa-times"
								onclick="PF('dlgPermissoes').hide();" alt="Fechar" />
						</span>
					</div>
				</h:form>

				<!-- TABELA DE PERMISSÕES -->
				<h:form id="formTabelaPermissoes">
					<p:dataTable id="tabela" value="#{usuarioMB.permisssoes}"
						resizableColumns="true" reflow="true" var="list" rows="5"
						paginator="true" paginatorPosition="bottom"
						emptyMessage="Nenhuma permissão cadastrada!"
						rowsPerPageTemplate="5,10,15,30,50,100">

						<p:column headerText="Descrição"
							filterBy="#{list.tipo.descricao}"
							sortBy="#{list.tipo.descricao}" filterMatchMode="contains">
							<h:outputText value="#{list.tipo.descricao}" />
						</p:column>

						<p:column headerText="Ações" width="100">
							<div class="action-btn-group">
								<span class="btn-danger-modern">
									<p:commandButton icon="fa fa-trash-o" value=" Excluir"
										actionListener="#{usuarioMB.inativarPermissao(list)}" title="Excluir"
										update="@form" alt="Excluir">
										<p:confirm header="Confirmação" message="Deseja excluir?" />
									</p:commandButton>
								</span>
							</div>
						</p:column>

					</p:dataTable>
				</h:form>

			</p:dialog>

		</div><!-- /.gf-page -->

		</ui:define>
	</ui:composition>
</h:body>
</html>
