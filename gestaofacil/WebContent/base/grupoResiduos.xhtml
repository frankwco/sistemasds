<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://java.sun.com/jsf/core">
<h:body>
	<ui:composition
		template="../resources/template/template-administrador.xhtml">
		<ui:define name="mensagem">
			<ui:include src="../componentes/mensagem.xhtml" />
		</ui:define>
		<ui:define name="modal-confirmacao">
			<ui:include src="../componentes/dialog-confirmacao.xhtml" />
		</ui:define>

		<ui:define name="conteudo">

		<div class="gf-page">

			<!-- ═══ HERO BANNER ═══ -->
			<div class="gf-hero hero-compact">
				<div>
					<h2><i class="fa fa-recycle" style="margin-right:10px;"></i>Grupos de Resíduos</h2>
					<p>Cadastre e gerencie os grupos de resíduos</p>
				</div>
			</div>

			<!-- ═══ CARD: Novo registro ═══ -->
			<div class="gf-card">
				<h:form id="frmCadastrar">
					<span class="gf-new-btn">
						<p:commandButton value="  Cadastrar" icon="fa fa-plus"
							update=":frmModalSalvar"
							actionListener="#{grupoResiduoMB.criarNovoObjeto()}"
							onclick="PF('dlgGrupoResiduo').show(); PF('dlgGrupoResiduo').content.scrollTop('0')"
							title="Cadastrar Grupo de Resíduo" />
					</span>
				</h:form>
			</div>

			<!-- ═══ CARD: Tabela ═══ -->
			<div class="gf-card">
				<h:form id="frmTabela">
					<p:dataTable id="tabela" value="#{grupoResiduoMB.listGrupoResiduo}"
						resizableColumns="true" reflow="true" var="list" rows="10"
						paginator="true" paginatorPosition="bottom"
						emptyMessage="Nenhum grupo cadastrado"
						rowsPerPageTemplate="5,10,15,30,50,100">

						<p:column headerText="Nome" filterBy="#{list.descricao}"
							sortBy="#{list.descricao}" filterMatchMode="contains">
							<h:outputText value="#{list.descricao}" />
						</p:column>

						<p:column headerText="Destino" filterBy="#{list.destino}"
							sortBy="#{list.destino}" filterMatchMode="contains">
							<h:outputText value="#{list.destino}" />
						</p:column>

						<p:column headerText="Definição" filterBy="#{list.definicao}"
							sortBy="#{list.definicao}" filterMatchMode="contains">
							<h:outputText value="#{list.definicao}" />
						</p:column>

						<p:column headerText="Ordem" filterBy="#{list.ordem}"
							sortBy="#{list.ordem}" filterMatchMode="contains">
							<h:outputText value="#{list.ordem}" />
						</p:column>

						<p:column headerText="Ações" width="90">
							<div class="action-btn-icons">
								<span class="btn-primary-modern">
									<p:commandButton icon="fa fa-pencil"
										update=":frmModalSalvar" title="Alterar"
										oncomplete="PF('dlgGrupoResiduo').show();"
										actionListener="#{grupoResiduoMB.preencherListaEstado(list)}" />
								</span>
								<span class="btn-danger-modern">
									<p:commandButton icon="fa fa-trash-o"
										actionListener="#{grupoResiduoMB.inativar(list)}" title="Excluir"
										update=":frmTabela :dlgInformacao" alt="Excluir">
										<p:confirm header="Confirmação" message="Deseja excluir?" />
									</p:commandButton>
								</span>
							</div>
						</p:column>

					</p:dataTable>
				</h:form>
			</div>

			<!-- ═══ DIALOG: Cadastrar/Editar ═══ -->
			<p:dialog header="Grupo de Resíduo" widgetVar="dlgGrupoResiduo" modal="true"
				responsive="true" width="60%" id="dlgGrupoResiduo" closable="true"
				closeOnEscape="true" resizable="false" draggable="false">
				<h:form id="frmModalSalvar">
					<div class="gf-form-group" style="flex-direction:column;">
						<div class="gf-form-item">
							<label><i class="fa fa-tag" style="margin-right:6px;color:#1565C0;"></i>Nome *</label>
							<p:inputText style="width:100%" required="true"
								requiredMessage="Nome é obrigatório"
								title="Nome" value="#{grupoResiduoMB.grupoResiduo.descricao}" />
						</div>

						<div class="gf-form-item">
							<label><i class="fa fa-map-marker" style="margin-right:6px;color:#1565C0;"></i>Destino *</label>
							<p:inputText style="width:100%" required="true"
								requiredMessage="Destino é obrigatório"
								title="Destino" value="#{grupoResiduoMB.grupoResiduo.destino}" />
						</div>

						<div class="gf-form-item">
							<label><i class="fa fa-file-text-o" style="margin-right:6px;color:#1565C0;"></i>Definição *</label>
							<p:inputText style="width:100%" required="true"
								requiredMessage="Definição é obrigatória"
								title="Definição" value="#{grupoResiduoMB.grupoResiduo.definicao}" />
						</div>

						<div class="gf-form-item">
							<label><i class="fa fa-sort-numeric-asc" style="margin-right:6px;color:#1565C0;"></i>Ordem *</label>
							<p:inputNumber style="width:100%" decimalPlaces="0" required="true"
								requiredMessage="Ordem é obrigatória"
								title="Ordem" value="#{grupoResiduoMB.grupoResiduo.ordem}" />
						</div>
					</div>
					<small>Campos obrigatórios *</small>

					<div class="gf-modal-footer">
						<span class="btn-primary-modern">
							<p:commandButton value="  Salvar" icon="fa fa-save"
								actionListener="#{grupoResiduoMB.salvar()}"
								update=":dlgInformacao :frmTabela" />
						</span>
						<span class="btn-secondary-modern">
							<p:commandButton value="  Cancelar" icon="fa fa-times"
								onclick="PF('dlgGrupoResiduo').hide();" alt="Cancelar" />
						</span>
					</div>
				</h:form>
			</p:dialog>

		</div><!-- /.gf-page -->

		</ui:define>

	</ui:composition>
</h:body>
</html>
