<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:pe="http://primefaces.org/ui/extensions"
	xmlns:p="http://primefaces.org/ui">

<ui:composition template="resources/template/template-padrao.xhtml">

	<ui:define name="mensagem">
		<ui:include src="/componentes/mensagem.xhtml" />
	</ui:define>

	<ui:define name="conteudo">
		<p:ajaxStatus onstart="PF('statusDialog').show()"
			onsuccess="PF('statusDialog').hide()" />

		<p:dialog widgetVar="statusDialog" modal="true" draggable="false"
			closable="false" resizable="false" showHeader="false">
			<h:outputText style="font-weight:bold"
				value="Aguarde, realizando operação...." />
			<br />
			<center>
				<p:graphicImage name="img/aguarde.gif" />
			</center>
		</p:dialog>
		<div class="container-fluid">
			<div style="margin-top: 50px;"
				class="col-md-4 col-md-offset-4 col-sm-10 col-sm-offset-2">
				<div class="panel panel-primary">
					<div class="panel-heading">
						<div class="panel-title">Gestão Fácil - Recuperar senha</div>
					</div>
					<div style="padding-top: 30px" class="panel-body">
						<h:outputText value="Usuário ou senha incorreto"
							rendered="#{param.error==true}" />

						<h:panelGrid columns="1" styleClass="col-md-12">
							<h:form>
								<h:outputText value="#{recuperSenhaLoginMB.mensagem}"
									id="mensagem" />
								<div style="padding-top: 10px">
									<label>E-mail</label>
									<p:inputText required="true" id="email" styleClass="col-md-12"
										type="email" value="#{recuperSenhaLoginMB.email}" />
								</div>
								<br />
								<div style="padding-top: 20px">
									<p:commandButton value="Recuperar"
										styleClass="ui-priority-primary btn btn-block" update="@form"
										actionListener="#{recuperSenhaLoginMB.recuperarSenhaLogin()}" />
								
								</div>
							</h:form>
							<h:form>
								<p:commandLink value="Voltar para a Página Inicial"
										ajax="false" action="index.jsf?redirect=true" />
							</h:form>

						</h:panelGrid>

					</div>
				</div>
			</div>
		</div>
	</ui:define>
</ui:composition>
</html>
