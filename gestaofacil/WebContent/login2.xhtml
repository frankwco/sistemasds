<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:pe="http://primefaces.org/ui/extensions"
	xmlns:p="http://primefaces.org/ui">

<ui:composition template="resources/template/template-padrao.xhtml">
	<ui:define name="mensagem">
		<ui:include src="componentes/mensagem.xhtml" />
	</ui:define>
	<ui:define name="modal-confirmacao">
		<ui:include src="componentes/dialog-confirmacao.xhtml" />
	</ui:define>
	<ui:define name="conteudo">
		<p:ajaxStatus onstart="PF('statusDialog').show()"
			onsuccess="PF('statusDialog').hide()" />

		<p:dialog widgetVar="statusDialog" modal="true" draggable="false"
			closable="false" resizable="false" showHeader="false">
			<h:outputText style="font-weight:bold"
				value="Aguarde, realizando operação...." />
			<br />
			<center>
				<p:graphicImage name="img/aguarde.gif" />
			</center>
		</p:dialog>
		<div class="container-fluid">
			<div style="margin-top: 50px;"
				class="col-md-4 col-md-offset-4 col-sm-10 col-sm-offset-2">
				<div class="panel panel-primary">
					<div class="panel-heading">
						<div class="panel-title">Login</div>
					</div>
					<div style="padding-top: 30px" class="panel-body">
						<h:outputText value="E-mail ou senha incorretos"
							rendered="#{param.error==true}" />

						<h:panelGrid columns="1" styleClass="col-md-12  col-xs-12">
							<form id="frmLogin" action="j_spring_security_check"
								method="post">
								<label>E-mail</label>
								<p:inputText required="true" id="j_username"
									styleClass="col-md-12 col-xs-12" />

								<div style="padding-top: 10px">
									<label>Senha</label>
									<p:password required="true" id="j_password"
										styleClass="col-md-12 col-xs-12" />
								</div>
								<div style="padding-top: 10px">
									<h:commandButton value="Entrar"
										styleClass="ui-priority-primary btn btn-block" />
								</div>

							</form>
							<br />
							<h:form>
								<p:commandLink value="Esqueceu ou deseja criar uma nova senha?"
									onclick="PF('dlgRecuperarSenha').show();" />
							</h:form>
						</h:panelGrid>

					</div>
				</div>
			</div>
		</div>

		<p:dialog header="Recuperar a Senha" widgetVar="dlgRecuperarSenha"
			modal="true" responsive="true" id="dlgRecuperarSenha" closable="true"
			closeOnEscape="true" resizable="false" draggable="false">

			<div style="padding-top: 30px" class="panel-body">

				<p:messages id="messages" showDetail="true" closable="true">
					<p:autoUpdate />
				</p:messages>
				
				<h:form id="frmModalRecuperarSenha">
					<p:panelGrid>

						<div class="col-md-12">

							<label>E-mail</label><br />
							<p:inputText requiredMessage="Informar o e-mail" required="true" id="email" styleClass="col-md-12"
								type="email" value="#{recuperSenhaLoginMB.email}" />
						</div>

						<div class="col-md-12"  style="padding-top: 15px">
							<p:commandButton value="Recuperar"
								styleClass="ui-priority-primary btn btn-block" update="@form"
								actionListener="#{recuperSenhaLoginMB.recuperarSenhaLogin()}" />

						</div>
					</p:panelGrid>
				</h:form>

					<h:form >
					<p:panelGrid>
					<div style="padding-top: 15px" class="col-md-12">
						<p:commandButton value="Fechar"
							styleClass="ui-priority-danger btn btn-block"
							onclick="PF('dlgEstado').hide();" />
					</div>
					</p:panelGrid>
				</h:form>



			</div>


		</p:dialog>
	</ui:define>
</ui:composition>
</html>
